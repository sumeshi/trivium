<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trivium</title>
    <link rel="icon" href="/favicon.ico" />
    <script type="module">
      import { DEFAULT_THEME, parseSavedTheme } from "/src/lib/themeModel.ts";
      (() => {
        try {
          const theme = parseSavedTheme(localStorage.getItem("trivium:theme")) ?? DEFAULT_THEME;
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", DEFAULT_THEME);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
