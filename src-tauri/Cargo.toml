[package]
name = "trivium-desktop"
version = "0.1.4"
edition = "2021"
authors = ["sumeshi <sum3sh1@protonmail.com>"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
parking_lot.workspace = true
polars.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
thiserror.workspace = true
uuid.workspace = true
trivium-engine = { path = "../crates/engine" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Release settings live in the workspace root Cargo.toml. Keeping a second
# profile here makes Cargo warn that the non-root profile is ignored.

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
