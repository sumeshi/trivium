name: Debian build

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy,rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> ../target'

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Quality gates
        run: |
          bash scripts/check_rust_size.sh
          cargo clippy --locked -p trivium-engine --all-targets -- -D warnings
          cargo test --locked -p trivium-engine
          cargo run --locked -p trivium-engine --bin export_contracts -- --check
          npm run lint
          npm run lint:test
          npm run test:ui
          npm run build

      - name: Build deb bundle
        run: npm run tauri build -- --bundles deb

      - name: Build standalone CLI
        run: cargo build --locked --release -p trivium-engine --bin trivium-cli

      - name: Generate SHA256SUMS
        run: |
          # The Cargo workspace puts the target dir at the repo root (R0a),
          # so bundles land in target/release/bundle/deb — not src-tauri/target.
          deb_dir="target/release/bundle/deb"
          ls "$deb_dir"
          (cd "$deb_dir" && sha256sum *.deb > SHA256SUMS)

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: trivium-deb
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/SHA256SUMS
          retention-days: 3

      - name: Upload standalone Linux CLI
        uses: actions/upload-artifact@v5
        with:
          name: trivium-cli-linux-x86_64
          path: target/release/trivium-cli
          retention-days: 3
