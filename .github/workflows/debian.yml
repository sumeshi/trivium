name: Linux build

on:
  push:
    branches: [ develop ]
    paths-ignore: ['**/*.md', 'screenshot.jpeg']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-deb:
    # Build against glibc 2.35 so newer Linux hosts can use the AppImage.
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy,rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> ../target'
          key: ubuntu-22.04

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Quality gates
        run: |
          python tests/check_build_identity.py
          python scripts/third_party_licenses.py --check
          python tests/package_artifacts_test.py
          bash scripts/check_rust_size.sh
          cargo clippy --locked -p trivium-engine --all-targets -- -D warnings
          cargo test --locked -p trivium-engine
          cargo run --locked -p trivium-engine --bin export_contracts -- --check
          npm run lint
          npm run lint:test
          npm run test:ui
          npm run build

      - name: Include bundled Linux dependency licenses
        run: python scripts/third_party_licenses.py --include-system

      - name: Build deb and AppImage bundles
        run: npm run tauri build -- --bundles deb,appimage

      - name: Build standalone CLI
        run: cargo build --locked --release -p trivium-engine --bin trivium-cli

      - name: Prepare desktop and optional CLI artifacts
        run: |
          rm -rf target/artifacts
          app_version=$(node -p "require('./package.json').version")
          python scripts/package_artifacts.py --kind desktop-app --platform linux-x86_64 --output target/artifacts/trivium-deb target/release/bundle/deb/*_"$app_version"_*.deb
          python scripts/package_artifacts.py --kind desktop-app --platform linux-x86_64 --output target/artifacts/trivium-appimage target/release/bundle/appimage/*_"$app_version"_*.AppImage
          python scripts/package_artifacts.py --kind automation-cli --platform linux-x86_64 --output target/artifacts/trivium-cli-linux target/release/trivium-cli

      - name: Upload Debian application
        uses: actions/upload-artifact@v5
        with:
          name: trivium-deb
          path: target/artifacts/trivium-deb/
          retention-days: ${{ github.ref == 'refs/heads/develop' && 3 || 30 }}

      - name: Upload portable Linux application
        uses: actions/upload-artifact@v5
        with:
          name: trivium-appimage
          path: target/artifacts/trivium-appimage/
          retention-days: ${{ github.ref == 'refs/heads/develop' && 3 || 30 }}

      - name: Upload optional Linux automation CLI
        uses: actions/upload-artifact@v5
        with:
          name: trivium-cli-linux-x86_64
          path: target/artifacts/trivium-cli-linux/
          retention-days: ${{ github.ref == 'refs/heads/develop' && 3 || 30 }}

  appimage-smoke:
    needs: build-deb
    # Exercise the packaged 22.04 build on a different, newer host.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb xauth
          cargo install tauri-driver --version 2.1.0 --locked

      - uses: actions/download-artifact@v5
        with:
          name: trivium-appimage
          path: target/appimage-artifact

      - name: Verify and extract AppImage without FUSE
        working-directory: target/appimage-artifact
        run: |
          test -s LICENSE
          test -s THIRD_PARTY_LICENSES.txt
          images=(./*.AppImage)
          test "${#images[@]}" -eq 1
          chmod +x "${images[0]}"
          "${images[0]}" --appimage-extract > appimage-extract.log
          test -x squashfs-root/AppRun
          python - <<'PY'
          from pathlib import Path
          root = Path('squashfs-root')
          for pattern in ['libgtk-3.so*', 'libwebkit2gtk-4.1.so*', 'libjavascriptcoregtk-4.1.so*', 'WebKitWebProcess', 'WebKitNetworkProcess', '*.desktop', 'THIRD_PARTY_LICENSES.txt']:
              if not any(path.is_file() for path in root.rglob(pattern)):
                  raise SystemExit(f'AppImage payload is missing {pattern}')
          PY
          readelf --version-info squashfs-root/usr/bin/trivium-desktop | python -c 'import re,sys; versions=[tuple(map(int,m.split("."))) for m in re.findall(r"GLIBC_([0-9.]+)",sys.stdin.read())]; assert versions and max(versions)<=(2,35), versions; print("Maximum application glibc requirement:",max(versions))'

      - name: Packaged AppImage navigation smoke
        run: xvfb-run -a python tests/native/row_navigation.py --binary target/appimage-artifact/squashfs-root/AppRun --rows 5199 --output target/native-appimage

      - name: Upload AppImage test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivium-appimage-native-evidence
          path: target/native-appimage/
          retention-days: 3
          if-no-files-found: ignore
