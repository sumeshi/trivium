name: Debian build

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> ../target'

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev

      - name: Quality gates
        run: |
          bash scripts/check_rust_size.sh
          cargo test -p trivium-engine
          npm run lint

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build deb bundle
        run: npm run tauri build -- --bundles deb

      - name: Generate SHA256SUMS
        run: |
          # The Cargo workspace puts the target dir at the repo root (R0a),
          # so bundles land in target/release/bundle/deb — not src-tauri/target.
          deb_dir="target/release/bundle/deb"
          ls "$deb_dir"
          (cd "$deb_dir" && sha256sum *.deb > SHA256SUMS)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trivium-deb
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/SHA256SUMS
          retention-days: 3
