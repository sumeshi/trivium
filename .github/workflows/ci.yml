name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> ../target'

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Quality gates
        run: |
          bash scripts/check_rust_size.sh
          cargo clippy -p trivium-engine --lib -- -D warnings
          cargo test -p trivium-engine
          npm run lint
          npm run lint:test
          npm run test:ui
          npm run build

      - name: Native type check
        run: cargo check -p trivium-desktop
