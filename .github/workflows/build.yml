name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform }}
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy,rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Quality gates
        shell: bash
        run: |
          python tests/check_build_identity.py
          python tests/build_manifest_test.py
          bash scripts/check_rust_size.sh
          cargo clippy --locked -p trivium-engine --all-targets -- -D warnings
          cargo test --locked -p trivium-engine
          cargo run --locked -p trivium-engine --bin export_contracts -- --check
          npm run lint
          npm run lint:test
          npm run test:ui

      - name: Build portable development application
        if: github.ref == 'refs/heads/develop'
        run: npm run tauri build -- --no-bundle

      - name: Build application and installer
        if: github.ref != 'refs/heads/develop'
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build standalone CLI
        run: cargo build --locked --release -p trivium-engine --bin trivium-cli

      - name: Get version from package.json
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Rename executable
        if: matrix.platform == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $src = "target/release/trivium-desktop.exe"
          $dst = "target/release/Trivium-v${{ steps.version.outputs.version }}.exe"
          if (Test-Path $src) {
            Move-Item -Force $src $dst
            Write-Host "Renamed $src to $dst"
          } else {
            Write-Error "Could not find the executable at $src"
            exit 1
          }

      - name: Prepare desktop and optional CLI artifacts
        shell: bash
        run: |
          python scripts/build_manifest.py --kind desktop-app --platform windows-x86_64 --output target/artifacts/trivium-windows "target/release/Trivium-v${{ steps.version.outputs.version }}.exe"
          python scripts/build_manifest.py --kind automation-cli --platform windows-x86_64 --output target/artifacts/trivium-cli-windows target/release/trivium-cli.exe

      - name: Upload desktop application
        uses: actions/upload-artifact@v5
        with:
          name: trivium-windows-exe
          path: target/artifacts/trivium-windows/
          retention-days: ${{ github.ref == 'refs/heads/develop' && 3 || 30 }}

      - name: Upload optional Windows automation CLI
        uses: actions/upload-artifact@v5
        with:
          name: trivium-cli-${{ matrix.platform }}
          path: target/artifacts/trivium-cli-windows/
          retention-days: ${{ github.ref == 'refs/heads/develop' && 3 || 30 }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts

      - name: Get version from package.json
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            artifacts/**/Trivium-v*.exe
            artifacts/**/trivium-cli.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
