name: Native smoke

on:
  pull_request:
    paths-ignore: ['**/*.md', 'screenshot.jpeg']
  push:
    branches: [ develop ]
    paths-ignore: ['**/*.md', 'screenshot.jpeg']
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb xauth libxtst6
      - name: Match Windows WebView2 and Edge driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/native/install_edge_driver.ps1
      - name: Check package identity and native startup contract
        run: |
          python tests/check_build_identity.py
          python -m unittest discover -s tests/native -p "*_test.py"
      - run: npm ci
      - run: npm run build
      - name: Build real app with embedded assets
        env:
          TAURI_CONFIG: '{"identifier":"com.trivium.native-tests"}'
        run: cargo build --locked -p trivium-desktop --features custom-protocol
      - name: Install native app driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Linux native navigation smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/native/row_navigation.py --binary target/debug/trivium-desktop --rows 5199 2000000
      - name: Linux native investigation and wide-table checks
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/native/workspace_ui.py --binary target/debug/trivium-desktop
      - name: Windows native navigation smoke
        if: runner.os == 'Windows'
        run: python tests/native/row_navigation.py --binary target/debug/trivium-desktop.exe --rows 5199
      - name: Windows table presentation smoke
        if: runner.os == 'Windows'
        run: python tests/native/workspace_ui.py --binary target/debug/trivium-desktop.exe --table-presentation-only
      - name: Retain native logs and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: native-smoke-${{ runner.os }}
          path: |
            target/native-row-navigation/
            target/native-workspace-ui/
          if-no-files-found: warn
          retention-days: 3
