name: Build and Release

on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform }}
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy,rustfmt

      - name: Quality gates
        shell: bash
        run: |
          bash scripts/check_rust_size.sh
          cargo clippy --locked -p trivium-engine --all-targets -- -D warnings
          cargo test --locked -p trivium-engine
          cargo run --locked -p trivium-engine --bin export_contracts -- --check
          npm run lint
          npm run lint:test
          npm run test:ui

      - name: Build application
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build standalone CLI
        run: cargo build --locked --release -p trivium-engine --bin trivium-cli

      - name: Get version from package.json
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Rename executable
        if: matrix.platform == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $src = "target/release/trivium-desktop.exe"
          $dst = "target/release/Trivium-v${{ steps.version.outputs.version }}.exe"
          if (Test-Path $src) {
            Move-Item -Force $src $dst
            Write-Host "Renamed $src to $dst"
          } else {
            Write-Error "Could not find the executable at $src"
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: trivium-${{ matrix.platform }}
          path: |
            target/release/Trivium-v*.exe
            target/release/trivium-cli.exe
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts

      - name: Get version from package.json
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            artifacts/**/Trivium-v*.exe
            artifacts/**/trivium-cli.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
