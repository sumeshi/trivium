name: Windows build

on:
  push:
    branches: [ develop ]
    paths-ignore: ['**/*.md', 'screenshot.jpeg']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform }}
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy,rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Quality gates
        shell: bash
        run: |
          rust_gate() {
            local rust_stage="$1"
            shift
            local rust_log="$RUNNER_TEMP/trivium-${rust_stage}.log"
            set +e
            "$@" 2>&1 | tee "$rust_log"
            local rust_status=${PIPESTATUS[0]}
            set -e
            if [ "$rust_status" -ne 0 ]; then
              python - "$rust_log" "$rust_stage" "$rust_status" <<'PY' || true
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          text = re.sub(r"\x1b\][^\x1b\x07]*(?:\x07|\x1b\\)", "", text)
          text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
          details = []
          for line in text.splitlines():
              error = re.match(r"\s*error(?:\[(E[0-9]{4})\])?:", line)
              if error:
                  details.append(f"Rust error {error[1]}" if error[1] else "Rust compiler or lint error")
              lint = re.search(r"\bclippy::[a-z_][a-z0-9_-]*\b", line)
              if lint:
                  details.append(lint[0])
              linker = re.search(r"\b(?:fatal error|error) (LNK[0-9]{4})\b", line)
              if linker:
                  details.append(linker[1])
              failed = re.match(r"\s*test ([A-Za-z_][A-Za-z0-9_:]*) \.\.\. FAILED\b", line)
              if failed:
                  details.append(f"FAILED {failed[1]}")
              location = re.search(r"(?:--> |panicked at )(.+?\.rs):([0-9]+):([0-9]+)", line)
              if location:
                  name = location[1].replace("\\", "/").rsplit("/", 1)[-1]
                  if re.fullmatch(r"[A-Za-z0-9_.-]{1,100}\.rs", name):
                      details.append(f"{name}:{location[2]}:{location[3]}")
          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          lines = [f"Rust {sys.argv[2]} failed (exit {sys.argv[3]})"]
          for detail in dict.fromkeys(details):
              candidate = lines + [detail[:120]]
              if len(lines) == 10 or len(escape("\n".join(candidate))) > 300:
                  break
              lines = candidate
          title = {"clippy": "Clippy", "tests": "Rust tests"}.get(sys.argv[2], "Rust quality gate")
          print(f"\n::error title={title}::{escape(chr(10).join(lines))}")
          PY
            fi
            return "$rust_status"
          }
          python tests/check_build_identity.py
          python scripts/third_party_licenses.py --check
          python tests/package_artifacts_test.py
          bash scripts/check_rust_size.sh
          rust_gate clippy cargo clippy --locked -p trivium-engine --all-targets -- -D warnings
          rust_gate tests cargo test --locked -p trivium-engine
          cargo run --locked -p trivium-engine --bin export_contracts -- --check
          npm run lint
          npm run lint:test
          npm run test:ui

      - name: Build portable application
        run: npm run tauri build -- --no-bundle

      - name: Build standalone CLI
        run: cargo build --locked --release -p trivium-engine --bin trivium-cli

      - name: Get version from package.json
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Rename executable
        if: matrix.platform == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $src = "target/release/trivium-desktop.exe"
          $dst = "target/release/Trivium-v${{ steps.version.outputs.version }}.exe"
          if (Test-Path $src) {
            Move-Item -Force $src $dst
            Write-Host "Renamed $src to $dst"
          } else {
            Write-Error "Could not find the executable at $src"
            exit 1
          }

      - name: Prepare desktop and optional CLI artifacts
        shell: bash
        run: |
          rm -rf target/artifacts
          python scripts/package_artifacts.py --kind desktop-app --platform windows-x86_64 --output target/artifacts/trivium-windows "target/release/Trivium-v${{ steps.version.outputs.version }}.exe"
          python scripts/package_artifacts.py --kind automation-cli --platform windows-x86_64 --output target/artifacts/trivium-cli-windows target/release/trivium-cli.exe

      - name: Upload desktop application
        uses: actions/upload-artifact@v5
        with:
          name: trivium-windows-exe
          path: target/artifacts/trivium-windows/
          retention-days: ${{ github.ref == 'refs/heads/develop' && 3 || 30 }}

      - name: Upload optional Windows automation CLI
        uses: actions/upload-artifact@v5
        with:
          name: trivium-cli-${{ matrix.platform }}
          path: target/artifacts/trivium-cli-windows/
          retention-days: ${{ github.ref == 'refs/heads/develop' && 3 || 30 }}
